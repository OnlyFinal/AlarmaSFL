name: Build Alarma SFL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     
      - name: Diagnosticar proyecto
        run: |
          echo "=== DIRECTORIO ==="
          pwd
          echo "=== ARCHIVOS GRADLE ==="
          ls -la
          echo "=== SETTINGS.GRADLE.KTS ==="
          cat settings.gradle.kts
          echo "=== BUILD.GRADLE.KTS ==="
          cat build.gradle.kts

      - name: Compilar APK
        run: gradle assembleDebug --stacktraces/upload-artifact@v4
        with:
          name: AlarmaSFL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
