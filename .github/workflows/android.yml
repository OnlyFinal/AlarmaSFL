name: Build Alarma SFL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Recuperar firma estable de desarrollo\n        uses: actions/cache@v4\n        with:\n          path: ~/.android/debug.keystore\n          key: alarmasfl-debug-signing-v1\n\n      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnosticar proyecto
        run: |
          echo "=== DIRECTORIO ==="
          pwd
          echo "=== ARCHIVOS GRADLE ==="
          ls -la
          echo "=== SETTINGS.GRADLE.KTS ==="
          cat settings.gradle.kts
          echo "=== BUILD.GRADLE.KTS ==="
          cat build.gradle.kts

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlarmaSFL-APK
          path: app/build/outputs/apk/debug/app-debug.apk

